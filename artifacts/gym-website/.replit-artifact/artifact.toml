kind = "web"
previewPath = "/gym-website/"
title = "AES Gym Bolivia"
description = "Sitio web de AES Gym Bolivia con sucursales, precios, inscripción, suplementos, promociones, regalos y redes sociales."
version = "1.0.0"
id = "artifacts/gym-website"
router = "path"

[[services]]
name = "web"
paths = [ "/gym-website/" ]
localPort = 20942

[services.development]
run = "pnpm --filter @workspace/gym-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gym-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/gym-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20942"
BASE_PATH = "/gym-website/"
